
name: Build and deploy Alfalah Scholarship to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm install

      - name: Build React frontend
        run: npm run build

      - name: Verify frontend build
        run: |
          echo "Checking frontend build..."
          test -f dist/index.html
          echo "SUCCESS: dist/index.html exists"
          echo "Built files:"
          ls -la dist

      - name: Verify server file
        run: test -f server.js

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            .
            !.git/**
            !.github/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Verify deployment files
        run: |
          test -f server.js
          test -f package.json
          test -f dist/index.html
          echo "Server and frontend files are present."

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1944325E0666466584DA1926E551F83F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F7C989F1056745CEA20CDF7DC042720E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_89CB40BE69C54B6DA932C86EBE89D2A4 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: Oct-alfalah
          slot-name: Production
          package: .
